name: Deploy web to GitHub Pages

# Builds the web app and publishes it at https://<user>.github.io/<repo>/.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions". This workflow must be on the default branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the data (downloads from Tanzil)
        run: python3 tools/build_data.py --almizan-web
      - name: Printed mushaf pages (published with the owner's confirmation of permission, October 15, 2026)
        run: python3 tools/mushaf_pages.py --apply assets/mushaf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - name: Make sure the Study Quran and PDFs are not published
        # Al-Mizan and the printed mushaf pages are published on purpose (the owner confirmed permission); the Study Quran is not.
        run: |
          for d in intro; do
            test ! -e "web/dist/data/$d" || { echo "error: web/dist/data/$d is private content"; exit 1; }
          done
          if grep -q '"studyQuran"' web/dist/data/meta.json; then echo "error: meta.json lists the Study Quran"; exit 1; fi
          if find web/dist -iname '*.pdf' | grep -q .; then echo "error: a PDF is in web/dist"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
