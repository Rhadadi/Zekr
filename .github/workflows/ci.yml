name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The macOS job costs 10x the minutes of a Linux job on private repos, so it only runs when the iPhone app can be affected.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(ios/|tools/build_data.py|shared/|\.github/workflows/ci.yml)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  data-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data pipeline tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Build the data (downloads from Tanzil)
        run: python3 tools/build_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore

  swift-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_data.py
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: ZekrKit tests
        run: swift test
        working-directory: ios/ZekrKit

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the data (downloads from Tanzil)
        run: python3 tools/build_data.py
      - name: ZekrKit tests on macOS (uses Apple's SQLite3)
        run: swift test
        working-directory: ios/ZekrKit
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Build the app and the widget (iOS Simulator, no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Zekr.xcodeproj -scheme Zekr -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 40
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
