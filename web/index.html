<!doctype html>
<html lang="fa" dir="rtl" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f5c" />
    <meta name="description" content="Quran with Persian and English translations, recitation and an ayah of the day." />
    <title>ذکر · Zekr</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // Apply theme and language before first paint (avoids a flash). Settings live in localStorage.
      try {
        var s = JSON.parse(localStorage.getItem('zekr.settings') || '{}');
        var d = document.documentElement;
        if (s.theme) d.setAttribute('data-theme', s.theme);
        var l = s.lang && s.lang !== 'auto' ? s.lang : (navigator.language || 'en').slice(0, 2) === 'fa' ? 'fa' : 'en';
        d.lang = l; d.dir = l === 'fa' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Zekr needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
